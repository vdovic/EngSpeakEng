<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
  </defs>

  <!-- Rounded square background -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- Speech bubble body -->
  <rect x="96" y="112" width="320" height="228" rx="40" fill="white" fill-opacity="0.95"/>

  <!-- Speech bubble tail (pointing down-left) -->
  <path d="M160 340 L120 420 L240 340 Z" fill="white" fill-opacity="0.95"/>

  <!-- Text lines inside the bubble (representing vocabulary) -->
  <!-- Line 1 — long -->
  <rect x="136" y="158" width="180" height="20" rx="10" fill="#4f46e5" fill-opacity="0.85"/>
  <!-- Line 2 — medium -->
  <rect x="136" y="196" width="130" height="20" rx="10" fill="#4f46e5" fill-opacity="0.55"/>
  <!-- Line 3 — short (accent colour) -->
  <rect x="136" y="234" width="100" height="20" rx="10" fill="#7c3aed" fill-opacity="0.7"/>

  <!-- Small graduation cap top-right of bubble — mastery motif -->
  <rect x="310" y="150" width="76" height="10" rx="5" fill="#4f46e5" fill-opacity="0.4"/>
  <polygon points="348,132 386,155 348,178 310,155" fill="#4f46e5" fill-opacity="0.6"/>
  <line x1="386" y1="155" x2="386" y2="188" stroke="#4f46e5" stroke-opacity="0.5" stroke-width="8" stroke-linecap="round"/>
  <circle cx="386" cy="190" r="8" fill="#4f46e5" fill-opacity="0.5"/>
</svg>
